<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
</head>

<body>
    <section>
    <div>
        <img src="images/hawk_image.jpg" alt="hawk landing on a branch">
    </div>

    <div>
        <img src="images/hawk_image.jpg" alt="hawk landing on a branch" width="800">
    </div>
    </section>

    <section>
        <h2>Responsive images using srcset</h2>
        <img src="images/hummingbird-fallback.jpg" alt="hummingbird in flight" 
        srcset="images/hummingbird-640.jpg 640w, 
        images/hummingbird-1280.jpg 1280w,
        images/hummingbird-1920.jpg 1920w">
    </section>

</body>

</html>
