<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦎</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/hydQvpqNm_c?si=0zqh-4pox1U_fU9J&mute=1"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <img src="media/Lizard-Hello-GIF.gif" alt="waving lizard" class="waving-lizard">
        <div class="more-lizards-div">
            <p>lizard lizards & more lizards lizard lizards & more lizards lizard lizards & more lizards lizard lizards
                & more lizards lizard lizards & more lizards lizard lizards & more lizards lizard lizards & more lizards
                lizard lizards & more lizards lizard lizards & more lizards</p>
            <img src="media/Scream-GIF.gif" alt="screaming lizard" class="screaming-lizard">
        </div>
        <!-- autoplay video -->
        <video width="180" height="320" autoplay muted loop>
            <source src="media/lizard-video.mp4" type="video/mp4">
        </video>
        <!-- hover videos -->
        <video class="hover-video" width="180" height="320" muted loop>
            <source src="media/lizard-video.mp4" type="video/mp4">
        </video>
        <video class="hover-video" width="180" height="320" muted loop>
            <source src="media/lizard-video.mp4" type="video/mp4">
        </video>
        <!-- click on play video -->
        <video class="click-video" width="180" height="320" muted loop>
            <source src="media/lizard-video.mp4" type="video/mp4">
        </video>

        <video id="webcam" autoplay playsinline></video>

    </main>
    <script src="js/video.js"></script>
    <script src="js/webcam.js"></script>
</body>

</html>
